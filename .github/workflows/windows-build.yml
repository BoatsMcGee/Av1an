name: Build California Condor (Windows x64)
on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      CARGO_INCREMENTAL: 0
      FFMS_LIB_DIR: C:\ffms2\x64
      FFMS_INCLUDE_DIR: C:\ffms2\include

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: NASM setup
        uses: ilammy/setup-nasm@v1
        with:
          # version: 2.16.03
          from-source: false

      # fmetrics is compiled from a pinned commit (no prebuilt Windows release).
      # Zig 0.16.x specifically: 0.17 removed b.build_root used by build.zig.
      - name: Zig setup
        uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          activate-environment: true

      - name: VapourSynth Python package installation
        run: |
          uv pip install vapoursynth==79
          vapoursynth config
          "VSSCRIPT_PATH=$(vapoursynth get-vsscript)" >> "$env:GITHUB_ENV"

      # FFMS2 is a build input only: ffms2-sys needs its headers and import
      # library, and condor.exe links it statically.
      - name: FFMS2 installation
        run: |
          curl -L -o ffms2.7z "https://github.com/FFMS/ffms2/releases/download/5.0/ffms2-5.0-msvc.7z"
          7z x ffms2.7z
          Move-Item -Path "ffms2-5.0-msvc" -Destination "C:\ffms2"

      # rust-cache prunes `target/`, so it runs before anything is staged there.
      - uses: Swatinem/rust-cache@v2

      # Stages libvmaf and its MinGW runtime, libvship and fmetrics.
      - name: Stage native libraries
        shell: pwsh
        run: ./.github/scripts/stage-native-libs.ps1 -StageDir target/release

      # The crates find their libraries relative to the staged copies.
      - name: Record the native library search paths
        shell: pwsh
        run: |
          "VSHIP_PLUGIN_PATH=$env:GITHUB_WORKSPACE\target\release" >> "$env:GITHUB_ENV"
          "VMAF_MODEL_PATH=$env:GITHUB_WORKSPACE\target\release\model" >> "$env:GITHUB_ENV"
          "FMETRICS_LIB_DIR=$env:GITHUB_WORKSPACE\target\release" >> "$env:GITHUB_ENV"

      - name: Condor build
        run: cargo build --release --bin condor

      - name: Generate configuration schema
        shell: pwsh
        run: cargo run --release --bin generate-schema > california-condor/configuration.schema.json

      - name: Generate changelog
        id: changelog
        shell: bash
        run: bash ./.github/scripts/generate-changelog.sh

      # The assets are a directory: the VMAF models and the MinGW runtime must
      # sit beside the executable or they are not found.
      - name: Package the release archive
        shell: pwsh
        run: ./.github/scripts/package-release.ps1

      - name: Create or update prerelease for Condor
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: latest
          body: ${{ steps.changelog.outputs.body }}
          files: |
            target/condor-windows-x64.zip
            target/release/condor.exe
            california-condor/configuration.schema.json
          fail_on_unmatched_files: true

      - name: Create tagged release for Condor
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            target/condor-windows-x64.zip
            target/release/condor.exe
            california-condor/configuration.schema.json
          fail_on_unmatched_files: true

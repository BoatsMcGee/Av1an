name: Build California Condor (Windows x64)
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      CARGO_INCREMENTAL: 0
      FFMS_LIB_DIR: C:\ffms2\x64
      FFMS_INCLUDE_DIR: C:\ffms2\include

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: NASM setup
        uses: ilammy/setup-nasm@v1
        with:
          # version: 2.16.03
          from-source: false

      # fmetrics is compiled from a pinned commit (no prebuilt Windows release).
      # Zig 0.16.x specifically: 0.17 removed b.build_root used by build.zig.
      - name: Zig setup
        uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          activate-environment: true

      - name: VapourSynth Python package installation
        run: |
          uv pip install vapoursynth==79
          vapoursynth config
          "VSSCRIPT_PATH=$(vapoursynth get-vsscript)" >> "$env:GITHUB_ENV"

      # Headers/import library for ffms2-sys AND the mandatory runtime DLL.
      - name: FFMS2 installation
        run: |
          curl.exe -fL -o ffms2.7z "https://github.com/FFMS/ffms2/releases/download/5.0/ffms2-5.0-msvc.7z"
          if ($LASTEXITCODE -ne 0) { throw 'FFMS2 download failed.' }
          7z x ffms2.7z
          if ($LASTEXITCODE -ne 0) { throw 'FFMS2 extraction failed.' }
          Move-Item -Path "ffms2-5.0-msvc" -Destination "C:\ffms2"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # rust-cache prunes `target/`, so it runs before anything is staged there.
      - uses: Swatinem/rust-cache@v2

      # Stages FFMS2, libvmaf and its MinGW runtime, libvship and fmetrics.
      - name: Stage native libraries
        shell: pwsh
        run: ./.github/scripts/stage-native-libs.ps1 -StageDir target/release

      # The crates find their libraries relative to the staged copies.
      - name: Record the native library search paths
        shell: pwsh
        run: |
          "VSHIP_PLUGIN_PATH=$env:GITHUB_WORKSPACE\target\release" >> "$env:GITHUB_ENV"
          "VMAF_MODEL_PATH=$env:GITHUB_WORKSPACE\target\release\model" >> "$env:GITHUB_ENV"
          "FMETRICS_LIB_DIR=$env:GITHUB_WORKSPACE\target\release" >> "$env:GITHUB_ENV"

      - name: Condor build
        run: cargo build --release --bin condor

      - name: Generate configuration schema
        shell: pwsh
        run: cargo run --release --bin generate-schema > california-condor/configuration.schema.json

      # The assets are a directory: the VMAF models and the MinGW runtime must
      # sit beside the executable or they are not found.
      - name: Package the release archive
        shell: pwsh
        run: ./.github/scripts/package-release.ps1

      # LLVM is a declared windows-latest prerequisite; never install or use
      # a build-tree loader PATH. This gate must succeed before either upload.
      - name: Verify clean-extracted Windows runtime bundle
        shell: pwsh
        timeout-minutes: 10
        run: |
          # The executable fixtures use only stdlib; R01's Bash harness stays on Linux.
          python -B .github/scripts/tests/test_release_scripts.py -v ReleaseScriptTests.test_r02_archive_rejects_missing_empty_and_wrong_relative_entries ReleaseScriptTests.test_r02_real_import_policy_fails_closed
          if ($LASTEXITCODE -ne 0) { throw 'Offline release contracts failed.' }
          $readobj = Join-Path $env:ProgramFiles 'LLVM/bin/llvm-readobj.exe'
          if (-not (Test-Path $readobj -PathType Leaf)) { throw 'Runner prerequisite llvm-readobj is missing.' }
          python -B ./.github/scripts/verify-windows-bundle.py target/condor-windows-x64.zip --native --readobj $readobj
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows archive smoke failed.' }

      - name: Stage the release assets
        shell: pwsh
        run: python -B .github/scripts/coordinate-release.py stage windows

      - uses: actions/upload-artifact@v7
        with:
          name: condor-windows-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

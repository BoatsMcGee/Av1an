name: Build California Condor (Windows x64)
on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      CARGO_INCREMENTAL: 0
      FFMS_LIB_DIR: C:\ffms2\x64
      FFMS_INCLUDE_DIR: C:\ffms2\include

    steps:
      - name: NASM setup
        uses: ilammy/setup-nasm@v1
        with:
          # version: 2.16.03
          from-source: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          activate-environment: true

      - name: VapourSynth Python package installation
        run: |
          uv pip install vapoursynth==79
          vapoursynth config
          "VSSCRIPT_PATH=$(vapoursynth get-vsscript)" >> "$env:GITHUB_ENV"

      - name: FFMS2 installation
        run: |
          curl -L -o ffms2.7z "https://github.com/FFMS/ffms2/releases/download/5.0/ffms2-5.0-msvc.7z"
          7z x ffms2.7z
          Move-Item -Path "ffms2-5.0-msvc" -Destination "C:\ffms2"

      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Get latest commit
        id: get_commit
        shell: pwsh
        run: |
          $commit = git log -1 --pretty=format:"%h: %s (%an)"
          echo "message=$commit" >> $env:GITHUB_OUTPUT

      - name: Condor build
        run: cargo build --release --bin condor

      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          $lastTag = git describe --tags --abbrev=0 2>$null
          if (-not $lastTag) {
            $lastTag = 'HEAD~1'
          }
          echo "last_tag=$lastTag" >> $env:GITHUB_OUTPUT

          $all = git log "$lastTag..HEAD" --pretty=format:"- %s"
          if (-not $all) {
            $all = "No changes since $lastTag"
          }
          $lines = @($all -split "`n")
          $first10 = $lines | Select-Object -First 10
          $rest = $lines | Select-Object -Skip 10

          $body = "Latest build from $env:GITHUB_SHA`n`nCommit:`n${{ steps.get_commit.outputs.message }}`n`nChanges since $lastTag:`n$($first10 -join "`n")"

          if ($rest.Count -gt 0) {
            $more = $rest.Count
            $body += "`n`n<details>`n<summary>... and $more more commits</summary>`n`n$($rest -join "`n")`n</details>"
          }

          echo "body<<EOF" >> $env:GITHUB_OUTPUT
          echo "$body" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Create or update prerelease for Condor
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: latest
          body: ${{ steps.changelog.outputs.body }}
          files: target/release/condor.exe
          fail_on_unmatched_files: true

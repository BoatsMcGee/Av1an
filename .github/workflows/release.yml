# Only this coordinator publishes. Manual runs (including forks) build only.
name: Release California Condor
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/linux-build.yml
  windows:
    uses: ./.github/workflows/windows-build.yml

  release:
    needs: [linux, windows]
    if: >-
      ${{ github.repository == 'rust-av/Av1an' && github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) &&
          needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A queued old build can follow a new build. Recheck master inside this
    # non-cancelling lock; cancelling halfway through upload would mix assets.
    concurrency:
      group: condor-release-${{ github.repository }}-${{ github.ref == 'refs/heads/master' && 'latest' || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      # No run-id/pattern fallback: these are exact names in this run/attempt.
      - uses: actions/download-artifact@v8
        with:
          name: condor-linux-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoff/linux
      - uses: actions/download-artifact@v8
        with:
          name: condor-windows-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoff/windows
      - name: Publish coordinated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/coordinate-release.py publish

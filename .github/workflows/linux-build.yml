name: Build California Condor (Linux x64)
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Ubuntu 24.04 implies a glibc 2.39 baseline, not every metric/GPU runtime.
  build:
    runs-on: ubuntu-24.04

    env:
      CARGO_INCREMENTAL: 0
      FFMS_LIB_DIR: /usr/lib/x86_64-linux-gnu
      FFMS_INCLUDE_DIR: /usr/include

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm patchelf libclang-dev libffms2-dev libvulkan-dev meson ninja-build

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Exact 0.16.0 pin: installers reject mismatches; 0.17 removed b.build_root.
      - name: Zig setup
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.16.0'

      # rust-cache restores and prunes `target/`, run before staging
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Staged here so the metric libraries share the runner's glibc.
      - name: Stage native libraries
        run: bash ./.github/scripts/stage-native-libs.sh target/release

      # Runtime overrides for build-tree tools, not compile-time search hints.
      - name: Record the native library search paths
        run: |
          {
            echo "VSHIP_PLUGIN_PATH=$GITHUB_WORKSPACE/target/release"
            echo "VSHIP_LIB_DIR=$GITHUB_WORKSPACE/target/release"
            echo "VMAF_MODEL_PATH=$GITHUB_WORKSPACE/target/release/model"
            echo "FMETRICS_LIB_DIR=$GITHUB_WORKSPACE/target/release"
          } >> "$GITHUB_ENV"

      - name: Condor build
        run: cargo build --release --bin condor

      - name: Generate configuration schema
        run: cargo run --release --bin generate-schema > california-condor/configuration.schema.json

      - name: Package the release archive
        run: bash ./.github/scripts/package-release-linux.sh

      # The report colourises each verdict with ANSI escapes, which is why the
      # text is stripped before it is asserted. `libvship` is deliberately not
      # asserted: it loads a Vulkan device, so its verdict depends on the
      # runner's ICD rather than on the archive.
      - name: Smoke-test the archive
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          unzip -q "$GITHUB_WORKSPACE/target/condor-linux-x64.zip"
          # Build-tree overrides must not mask broken archive discovery.
          # The release uses its $ORIGIN runpath and adjacent model/ directory.
          unset FMETRICS_LIB_PATH FMETRICS_LIB_DIR VSHIP_PLUGIN_PATH VSHIP_LIB_DIR \
            VSSCRIPT_PATH VAPOURSYNTH_EXTRA_PLUGIN_PATH VMAF_LIB_DIR VMAF_MODEL_PATH \
            LD_LIBRARY_PATH DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH
          ./condor --version > version.txt 2>&1
          cat version.txt
          sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' version.txt > verdict.txt
          # The CPU metric libraries ship in the archive: they must load.
          grep -q '✓ libvmaf' verdict.txt
          grep -q '✓ fmetrics' verdict.txt
          readelf -d ./condor | grep -Fq "\$ORIGIN"

      - name: Stage the release assets
        run: python3 -B .github/scripts/coordinate-release.py stage linux

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: condor-linux-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

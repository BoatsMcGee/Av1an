name: Build California Condor (Linux x64)
on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Built on the runner: its Ubuntu 24.04 glibc (2.39) is the floor every
  # artifact and staged metric library is built against.
  build:
    runs-on: ubuntu-24.04

    env:
      CARGO_INCREMENTAL: 0
      FFMS_LIB_DIR: /usr/lib/x86_64-linux-gnu
      FFMS_INCLUDE_DIR: /usr/include

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm patchelf libclang-dev libffms2-dev libvulkan-dev meson ninja-build

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # fmetrics needs Zig 0.16.x specifically: 0.17 removed b.build_root.
      - name: Zig setup
        uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      # rust-cache restores and prunes `target/`, run before staging
      - uses: Swatinem/rust-cache@v2

      # Staged here so the metric libraries share the runner's glibc.
      - name: Stage native libraries
        run: bash ./.github/scripts/stage-native-libs.sh target/release

      # The crates find their libraries relative to the staged copies.
      - name: Record the native library search paths
        run: |
          echo "VSHIP_PLUGIN_PATH=$GITHUB_WORKSPACE/target/release" >> "$GITHUB_ENV"
          echo "VSHIP_LIB_DIR=$GITHUB_WORKSPACE/target/release" >> "$GITHUB_ENV"
          echo "VMAF_MODEL_PATH=$GITHUB_WORKSPACE/target/release/model" >> "$GITHUB_ENV"
          echo "FMETRICS_LIB_DIR=$GITHUB_WORKSPACE/target/release" >> "$GITHUB_ENV"

      - name: Condor build
        run: cargo build --release --bin condor

      - name: Generate configuration schema
        run: cargo run --release --bin generate-schema > california-condor/configuration.schema.json

      - name: Package the release archive
        run: bash ./.github/scripts/package-release-linux.sh

      # The report colourises each verdict with ANSI escapes, which is why the
      # text is stripped before it is asserted. `libvship` is deliberately not
      # asserted: it loads a Vulkan device, so its verdict depends on the
      # runner's ICD rather than on the archive.
      - name: Smoke-test the archive
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          unzip -q "$GITHUB_WORKSPACE/target/condor-linux-x64.zip"
          ./condor --version > version.txt 2>&1
          cat version.txt
          sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' version.txt > verdict.txt
          # The CPU metric libraries ship in the archive: they must load.
          grep -q '✓ libvmaf' verdict.txt
          grep -q '✓ fmetrics' verdict.txt
          readelf -d ./condor | grep -q '\$ORIGIN'

      - name: Stage the release assets
        run: |
          mkdir -p dist
          cp target/condor-linux-x64.zip dist/
          cp target/release/condor dist/

      - uses: actions/upload-artifact@v7
        with:
          name: condor-linux-x64
          path: dist/
          retention-days: 1

  # Full checkout: the changelog walks history and appends the Linux notes.
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download the release assets
        uses: actions/download-artifact@v8
        with:
          name: condor-linux-x64
          path: dist

      - name: Generate changelog
        id: changelog
        run: bash ./.github/scripts/generate-changelog.sh ./.github/scripts/linux-release-notes.md

      - name: Create or update prerelease for Condor
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: latest
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/condor-linux-x64.zip
            dist/condor
          fail_on_unmatched_files: true

      - name: Create tagged release for Condor
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/condor-linux-x64.zip
            dist/condor
          fail_on_unmatched_files: true

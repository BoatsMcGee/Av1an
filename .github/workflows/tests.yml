name: tests
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  formatting:
    runs-on: ubuntu-latest
    container:
      image: shssoichiro/av1an-ci@sha256:c97c0a987847aedd38be07c5fcdd8b95ecffe9e14a0c07ac0cbaa1a0598b0e19
      options: --user root
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Validate formatting
        run: |
          cargo +stable fmt --all -- --check

  unit-tests:
    runs-on: ubuntu-latest
    env:
      AV_METRICS_REQUIRE_CPU: '1'
      # Include Arch's rebuilt plugins after the system upgrade.
      VAPOURSYNTH_EXTRA_PLUGIN_PATH: /usr/lib/vapoursynth
    container:
      image: shssoichiro/av1an-ci@sha256:c97c0a987847aedd38be07c5fcdd8b95ecffe9e14a0c07ac0cbaa1a0598b0e19
      options: --user root
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup CPU-native test dependencies
        run: |
          # Arch requires a full upgrade when refreshing package databases.
          # Provision jq so install-action does not bootstrap it with a partial upgrade.
          pacman -Syu --noconfirm --needed git gcc clang nasm vapoursynth vmaf ffmpeg jq python-pip

          # WNNM integration tests need VSZip; keep Arch's VapourSynth installation.
          python -m pip install --no-cache-dir --break-system-packages \
            --only-binary=:all: --no-deps vapoursynth-vszip==24.0.0

          # Arch's `vmaf` package installs the models to /usr/share/model rather
          # than compiling them in. All nine upstream models are there, so point
          # VMAF_MODEL_PATH at them and skip a download entirely.
          echo "VMAF_MODEL_PATH=/usr/share/model" >> "$GITHUB_ENV"
          echo "VMAF_TEST_MODEL=/usr/share/model/vmaf_v0.6.1.json" >> "$GITHUB_ENV"

          # A short real clip for the tests that compare against libvmaf's own CLI
          # and FFmpeg's libvmaf filter. Generated rather than committed, so no
          # media enters the repository.
          ffmpeg -v error -f lavfi -i "testsrc2=size=320x240:rate=24:duration=2" \
            -pix_fmt yuv420p -y /tmp/vmaf-test.y4m
          echo "VMAF_TEST_Y4M=/tmp/vmaf-test.y4m" >> "$GITHUB_ENV"

      - name: Zig setup for fmetrics
        uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Install pinned CPU fmetrics
        run: |
          set -a
          . .github/.env
          set +a
          bash av-metrics-fmetrics/scripts/install-fmetrics-linux.sh \
            -Destination "$RUNNER_TEMP/fmetrics" -Quiet
          echo "FMETRICS_LIB_DIR=$RUNNER_TEMP/fmetrics" >> "$GITHUB_ENV"

      - name: Install cargo-msrv
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv

      - name: Validate executables
        run: |
          which aomenc
          which SvtAv1EncApp
          which rav1e
          which vpxenc
          which x265
          which x264
          which ffmpeg
          which mkvmerge

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Validate required CPU-native prerequisites
        run: |
          cargo +stable test --profile ci -p av-metrics-fmetrics --test correctness \
            loads_and_reports_its_version -- --exact --nocapture
          cargo +stable test --profile ci -p av-metrics-vmaf --test correctness \
            availability_probe_is_consistent -- --exact --nocapture

      - name: Build Condor
        run: |
          cargo clippy --profile ci -- -D warnings

      - name: Validate minimum Rust version
        run: |
          cargo msrv verify --path av-metrics-vmaf
          cargo msrv verify --path av-metrics-vship
          cargo msrv verify --path av-metrics-fmetrics
          cargo msrv verify --path andean-condor
          cargo msrv verify --path california-condor

      - name: Testing av-metrics-vmaf
        working-directory: ./av-metrics-vmaf
        run: |
          cargo test --profile ci

          # Report which models this libvmaf build actually accepts. A build
          # without -Denable_float=true rejects the float and BOUND models, and
          # that is otherwise only visible by reading the test output.
          cargo test --profile ci --test correctness \
            every_model_in_the_search_path_loads -- --nocapture

      # The runner has no GPU and no vship binary is installed, so the crate's
      # GPU-gated tests skip themselves; its non-GPU tests still run.
      # Required GPU coverage is a separate manual gate: `just test-gpu`.
      - name: Testing av-metrics-vship
        working-directory: ./av-metrics-vship
        run: |
          cargo test --profile ci

      # libfmetrics is required above; these tests exercise its real CPU API.
      - name: Testing av-metrics-fmetrics
        working-directory: ./av-metrics-fmetrics
        run: |
          cargo test --profile ci

      - name: Testing Andean Condor
        working-directory: ./andean-condor
        run: |
          cargo test --profile ci

      - name: Testing California Condor
        working-directory: ./california-condor
        run: |
          cargo test --profile ci

  code-coverage:
    needs: [formatting, unit-tests]
    runs-on: ubuntu-latest
    env:
      AV_METRICS_REQUIRE_CPU: '1'
      # Include Arch's rebuilt plugins after the system upgrade.
      VAPOURSYNTH_EXTRA_PLUGIN_PATH: /usr/lib/vapoursynth
    container:
      image: shssoichiro/av1an-ci@sha256:c97c0a987847aedd38be07c5fcdd8b95ecffe9e14a0c07ac0cbaa1a0598b0e19
      options: --user root
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup CPU-native test dependencies
        run: |
          # `vmaf` is needed for coverage, not just for tests. Without it the
          # crate still compiles but reports scoring as unavailable, so every
          # line in the scorer and the libvmaf FFI would be reported uncovered.
          # Arch requires a full upgrade when refreshing package databases.
          # Provision jq so install-action does not bootstrap it with a partial upgrade.
          pacman -Syu --noconfirm --needed git gcc clang nasm vapoursynth vmaf ffmpeg jq python-pip

          # WNNM integration tests need VSZip; keep Arch's VapourSynth installation.
          python -m pip install --no-cache-dir --break-system-packages \
            --only-binary=:all: --no-deps vapoursynth-vszip==24.0.0

          # Arch's package installs the models to /usr/share/model, which the
          # crate searches on its own. Set this anyway so coverage does not
          # depend on that search-path ordering.
          echo "VMAF_MODEL_PATH=/usr/share/model" >> "$GITHUB_ENV"
          echo "VMAF_TEST_MODEL=/usr/share/model/vmaf_v0.6.1.json" >> "$GITHUB_ENV"
          ffmpeg -v error -f lavfi -i "testsrc2=size=320x240:rate=24:duration=2" \
            -pix_fmt yuv420p -y /tmp/vmaf-test.y4m
          echo "VMAF_TEST_Y4M=/tmp/vmaf-test.y4m" >> "$GITHUB_ENV"

      - name: Zig setup for fmetrics
        uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Install pinned CPU fmetrics
        run: |
          set -a
          . .github/.env
          set +a
          bash av-metrics-fmetrics/scripts/install-fmetrics-linux.sh \
            -Destination "$RUNNER_TEMP/fmetrics" -Quiet
          echo "FMETRICS_LIB_DIR=$RUNNER_TEMP/fmetrics" >> "$GITHUB_ENV"

      - name: Validate executables
        run: |
          which aomenc
          which SvtAv1EncApp
          which rav1e
          which vpxenc
          which x265
          which x264
          which ffmpeg
          which mkvmerge

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Validate required CPU-native prerequisites
        run: |
          cargo +stable test --profile ci -p av-metrics-fmetrics --test correctness \
            loads_and_reports_its_version -- --exact --nocapture
          cargo +stable test --profile ci -p av-metrics-vmaf --test correctness \
            availability_probe_is_consistent -- --exact --nocapture

      - name: Generate code coverage
        run: cargo llvm-cov --profile ci --workspace --lcov --output-path lcov.log --ignore-filename-regex tests\.rs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.log
          fail_ci_if_error: false

  docker:
    needs: [formatting, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: av1an:action
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  docker-publish:
    needs: [unit-tests, docker]
    runs-on: ubuntu-latest
    # Forks, PRs and manual runs never enter a job with publishing credentials.
    if: >-
      github.repository == 'rust-av/Av1an' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Check publishing credentials
        id: credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Docker Hub publishing skipped: credentials not configured.'
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: docker_meta
        if: steps.credentials.outputs.ready == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/av1an
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Show publish intent
        if: steps.credentials.outputs.ready == 'true'
        env:
          DOCKER_TAGS: ${{ steps.docker_meta.outputs.tags }}
        run: |
          printf 'Intended Docker Hub tags (metadata only):\n%s\n' "$DOCKER_TAGS"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: steps.credentials.outputs.ready == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push
        id: docker_build
        if: steps.credentials.outputs.ready == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache

      - name: Image digest
        if: steps.credentials.outputs.ready == 'true'
        run: echo ${{ steps.docker_build.outputs.digest }}

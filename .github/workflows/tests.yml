name: tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  formatting:
    runs-on: ubuntu-latest
    container:
      image: boatsmcgee/condor:latest
      options: --user root
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Validate formatting
        run: |
          cargo fmt --all -- --check

  unit-tests:
    runs-on: ubuntu-latest
    container:
      image: boatsmcgee/condor:latest
      options: --user root
    steps:
      - uses: actions/checkout@v7

      - parallel:
        - name: Install Rust stable
          uses: dtolnay/rust-toolchain@stable

        - name: Setup Clang, NASM, VapourSynth, and libvmaf
          run: |
            pacman -S --noconfirm --needed clang nasm vapoursynth vmaf ffmpeg

            # Arch's `vmaf` package installs the models to /usr/share/model rather
            # than compiling them in. All nine upstream models are there, so point
            # VMAF_MODEL_PATH at them and skip a download entirely.
            echo "VMAF_MODEL_PATH=/usr/share/model" >> "$GITHUB_ENV"

            # A short real clip for the tests that compare against libvmaf's own CLI
            # and FFmpeg's libvmaf filter. Generated rather than committed, so no
            # media enters the repository.
            ffmpeg -v error -f lavfi -i "testsrc2=size=320x240:rate=24:duration=2" \
              -pix_fmt yuv420p -y /tmp/vmaf-test.y4m
            echo "VMAF_TEST_Y4M=/tmp/vmaf-test.y4m" >> "$GITHUB_ENV"

        - name: Install cargo-msrv
          uses: taiki-e/install-action@v2
          with:
            tool: cargo-msrv

        - name: Validate executables
          run: |
            which aomenc
            which SvtAv1EncApp
            which rav1e
            which vpxenc
            which x265
            which x264
            which ffmpeg
            which mkvmerge

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build Condor
        run: |
          cargo clippy --profile ci -- -D warnings

      - name: Validate minimum Rust version
        run: |
          cargo msrv verify --path av-metrics-vmaf
          cargo msrv verify --path av-metrics-vship
          cargo msrv verify --path andean-condor
          cargo msrv verify --path california-condor

      - name: Testing av-metrics-vmaf
        working-directory: ./av-metrics-vmaf
        run: |
          cargo test --profile ci

          # Report which models this libvmaf build actually accepts. A build
          # without -Denable_float=true rejects the float and BOUND models, and
          # that is otherwise only visible by reading the test output.
          cargo test --profile ci --test correctness \
            every_model_in_the_search_path_loads -- --nocapture

      # The runner has no GPU and no vship binary is installed, so the crate's
      # GPU-gated tests skip themselves; its non-GPU tests still run.
      - name: Testing av-metrics-vship
        working-directory: ./av-metrics-vship
        run: |
          cargo test --profile ci

      - name: Testing Andean Condor
        working-directory: ./andean-condor
        run: |
          cargo test --profile ci

      - name: Testing California Condor
        working-directory: ./california-condor
        run: |
          cargo test --profile ci

  code-coverage:
    needs: [formatting, unit-tests]
    runs-on: ubuntu-latest
    container:
      image: boatsmcgee/condor:latest
      options: --user root
    steps:
      - uses: actions/checkout@v7

      - parallel:
        - name: Install Rust stable
          uses: dtolnay/rust-toolchain@stable

        - name: Setup Git, Clang, NASM, VapourSynth, and libvmaf
          run: |
            # `vmaf` is needed for coverage, not just for tests. Without it the
            # crate still compiles but reports scoring as unavailable, so every
            # line in the scorer and the libvmaf FFI would be reported uncovered.
            pacman -S --noconfirm --needed git clang nasm vapoursynth vmaf

            # Arch's package installs the models to /usr/share/model, which the
            # crate searches on its own. Set this anyway so coverage does not
            # depend on that search-path ordering.
            echo "VMAF_MODEL_PATH=/usr/share/model" >> "$GITHUB_ENV"

        - name: Validate executables
          run: |
            which aomenc
            which SvtAv1EncApp
            which rav1e
            which vpxenc
            which x265
            which x264
            which ffmpeg
            which mkvmerge

        - name: Install cargo-llvm-cov
          uses: taiki-e/install-action@v2
          with:
            tool: cargo-llvm-cov

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Generate code coverage
        run: cargo llvm-cov --profile ci --workspace --lcov --output-path lcov.log --ignore-filename-regex tests\.rs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.log
          fail_ci_if_error: false

  docker:
    needs: [formatting, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: av1an:action
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # Job to output if docker-publish should run or not based on if DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are set
  publish-check:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Check for DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
        run: echo "Checking if Docker Hub secrets are configured"

  docker-publish:
    needs: [unit-tests, docker, publish-check]
    runs-on: ubuntu-latest
    if: needs.publish-check.outputs.should_publish == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: docker_meta

        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/condor
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
